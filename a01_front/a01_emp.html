<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사원 정보 검색</title>
    <!-- jQuery CDN 추가 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .search-container { margin-bottom: 20px; padding: 15px; background-color: #f5f5f5; border-radius: 5px; }
        .search-container input { margin-right: 15px; padding: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>

    <h2>사원 정보 검색 (jQuery AJAX)</h2>

    <div class="search-container">
        <label for="ename">사원명: </label>
        <input type="text" id="ename" name="ename" placeholder="사원명 입력">
        
        <label for="job">직책명: </label>
        <input type="text" id="job" name="job" placeholder="직책명 입력">
        
        <button type="button" id="searchBtn">검색</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>사원번호 (EMPNO)</th>
                <th>사원명 (ENAME)</th>
                <th>직책 (JOB)</th>
                <th>급여 (SAL)</th>
                
            </tr>
        </thead>
        <tbody id="empListBody">
            <!-- AJAX 결과가 여기에 출력됩니다. -->
        </tbody>
    </table>

    <script>
        $(document).ready(function() {
            // 1. 페이지 로드 시 전체 사원 목록 초기 조회 (선택 사항)
            loadEmps();

            // 2. 검색 버튼 클릭 시 조회 이벤트
            $("#searchBtn").click(function() {
                loadEmps();
            });

            // 3. 입력창에서 엔터키를 눌렀을 때 검색되도록 편의성 추가
            $("#ename, #job").keypress(function(e) {
                if (e.which === 13) {
                    loadEmps();
                }
            });

            // AJAX 데이터를 불러오는 메인 함수
            function loadEmps() {
                // input 필드에서 검색어 가져오기
                var enameVal = $("#ename").val();
                var jobVal = $("#job").val();
                // /api/emps?ename=A&job=MAN
                $.ajax({
                    url: "/api/emps",
                    type: "GET",
                    data: {
                        ename: enameVal,
                        job: jobVal
                    },
                    dataType: "json", // 서버에서 반환받을 데이터 타입
                    success: function(response) {
                        var html = "";
                        
                        // 데이터가 없을 경우 처리
                        if (response.length === 0) {
                            html += "<tr><td colspan='5'>검색된 사원 정보가 없습니다.</td></tr>";
                        } else {
                            // 반복문을 통해 반환된 데이터(JSON 배열)를 테이블 행(tr)으로 변환
                            $(response).each(function(index, emp) {
                                // emp = [{},{},{}]

                                // DB 반환 데이터가 대문자 키인지 소문자 키인지에 따라 맞춰주세요.
                                // 여기서는 일반적인 emp 딕셔너리 구조(소문자)를 가정했습니다.
                                var empno = emp.empno || emp.EMPNO || "-";
                                var ename = emp.ename || emp.ENAME || "-";
                                var job = emp.job || emp.JOB || "-";
                                var sal = emp.sal || emp.SAL || "-";
                                var deptno = emp.deptno || emp.DEPTNO || "-";

                                html += "<tr>";
                                html += "<td>" + empno + "</td>";
                                html += "<td>" + ename + "</td>";
                                html += "<td>" + job + "</td>";
                                html += "<td>" + sal + "</td>";
                                //html += "<td>" + deptno + "</td>";
                                html += "</tr>";
                            });
                        }

                        // 완성된 HTML 문자열을 tbody에 삽입
                        $("#empListBody").html(html);
                    },
                    error: function(xhr, status, error) {
                        console.error("AJAX 호출 에러: ", error);
                        alert("데이터를 가져오는 중 오류가 발생했습니다.");
                    }
                });
            }
        });
    </script>

</body>
</html>
